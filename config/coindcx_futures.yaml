# CoinDCX futures price-level strategy. You choose the prices; the bot watches 24/7.
# Edit this file on the server, then:  sudo systemctl restart strata@coindcx_futures
#
# entry_price: a number, or market (enter right away at the current price)
# side: long  -> buys when price reaches entry_price, sells at take_profit (higher) or stop_loss (lower)
# side: short -> sells when price reaches entry_price, buys back at take_profit (lower) or stop_loss (higher)
# entry_when: at_or_below (default for long) or at_or_above (default for short; use it for breakouts)
# quantity is in the coin (0.001 = 0.001 BTC). Margin used ~= entry_price * quantity / leverage.
# Leverage is capped at 10, and the stop must sit well inside the liquidation distance (~1/leverage).

poll_seconds: 5          # how often the price is checked
margin_currency: USDT
fee_pct: 0.05            # assumed fee per side, used for paper P&L

setups:
  # Ishwar's setup, 2026-11-17: buy BTC at market, sell at 64100, stop 64000, 1 BTC, 10x.
  # Only enters while price is between the stop and the target (a long needs SL < price < TP).
  - name: btc_scalp_long
    enabled: true
    pair: B-BTC_USDT
    side: long
    entry_price: market    # "market" = buy now at the current price
    take_profit: 64100
    stop_loss: 64000
    quantity: 1
    leverage: 10
    repeat: false
    price_decimals: 1

  - name: btc_dip_long     # original placeholder, switched off
    enabled: false
    pair: B-BTC_USDT
    side: long
    entry_price: 85000
    take_profit: 88000
    stop_loss: 83500
    quantity: 0.001
    leverage: 3
    repeat: false
    price_decimals: 1

  # Example short, switched off:
  - name: eth_rally_short
    enabled: false
    pair: B-ETH_USDT
    side: short
    entry_price: 3600
    take_profit: 3400
    stop_loss: 3700
    quantity: 0.01
    leverage: 2
    repeat: false
    price_decimals: 2
